# InterNote 站点配置（键说明见 https://github.com/interset-wq/InterNote 的 config.sample.toml）
# 修改本文件后需手动运行 Actions -> build Internote -> Run workflow 全局重建一次

[site]
title = "My Blog"
sub_title = "My notes on everything"
# avatar_url = ""           # 站点头像（header 显示）；留空则自动使用 owner 的 GitHub 头像
# favicon = ""              # 站点图标；留空 = 自动下载 owner 头像；填 URL 用自定义图；"none" 关闭
# home_url = ""             # 留空则自动推导（GitHub Pages 地址）
language = "CN"             # CN | EN
utc = 8                     # 时区偏移（小时）

# footer 社交图标（可选段；缺省 footer 自带 RSS + GitHub 两个内置图标，
# 用相同 id 的条目可覆盖内置图标的目标地址）
# [[social]]
# id = "bilibili"           # Simple Icons slug（https://simpleicons.org）
# title = "Bilibili"        # 悬停/无障碍文案，缺省用 id
# action = "link"           # link（跳转，默认）| copy（复制 username）| qrcode（弹二维码浮层）
# url = "https://space.bilibili.com/XXXX"

[layout]
posts_per_page = 10
# start_date = ""           # 建站日期（如 "2026-01-01"，首页显示运行天数）
# icp = ""                  # ICP 备案号
# footer_text = ""          # 文章页底部附加文字

[comments]
enabled = true

[giscus]
repo = ""                   # 如 "your-name/your-blog"（评论存储的仓库，需开启 Discussions）
repo_id = ""                # giscus.app 提供
category = ""               # 如 "Announcements"
category_id = ""            # giscus.app 提供

# 本地搜索无需配置：构建时生成 dist/search-index.json，
# 浏览器端按 title / 标签 / 日期匹配，无第三方服务。
